<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixelizador Retrô Pro — Imagem, Vídeo, Paletas & Estilos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #121216; color: #e4e4e7; display: flex; height: 100vh; overflow: hidden; }
    aside { width: 370px; background: #1a1a22; border-right: 1px solid #2e2e3a; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    h1 { font-size: 15px; color: #00ffcc; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #2e2e3a; padding-bottom: 8px; }
    section { background: #22222c; padding: 10px; border-radius: 6px; border: 1px solid #2f2f3d; display: flex; flex-direction: column; gap: 8px; }
    h2 { font-size: 12px; color: #a1a1aa; text-transform: uppercase; }
    label { font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    select, input[type="text"], input[type="number"] { background: #14141a; color: #fff; border: 1px solid #3f3f4e; padding: 5px 8px; border-radius: 4px; font-size: 12px; width: 100%; }
    input[type="range"] { width: 100%; accent-color: #00ffcc; }
    input[type="color"] { border: none; width: 32px; height: 24px; background: transparent; cursor: pointer; }
    .row { display: flex; gap: 6px; align-items: center; }
    button { background: #2d2d3a; color: #fff; border: 1px solid #454558; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: 600; transition: 0.15s; }
    button:hover { background: #3d3d4e; }
    button.primary { background: #00d4aa; color: #091512; border-color: #00ffcc; }
    button.primary:hover { background: #00ffcc; }
    button.danger { background: #e11d48; border-color: #fb7185; }
    main { flex: 1; display: flex; flex-direction: column; background: #0d0d11; }
    header { background: #181820; padding: 10px 16px; border-bottom: 1px solid #2e2e3a; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .canvas-area { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 20px; background-image: linear-gradient(45deg, #16161d 25%, transparent 25%), linear-gradient(-45deg, #16161d 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #16161d 75%), linear-gradient(-45deg, transparent 75%, #16161d 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; }
    canvas { box-shadow: 0 10px 30px rgba(0,0,0,0.7); image-rendering: pixelated; max-width: none; }
    footer { background: #181820; padding: 8px 16px; border-top: 1px solid #2e2e3a; display: flex; align-items: center; gap: 10px; font-size: 12px; }
    .palette-preview { display: flex; height: 14px; border-radius: 3px; overflow: hidden; border: 1px solid #3f3f4e; }
    .palette-preview div { flex: 1; }
    .status-badge { font-size: 11px; color: #00ffcc; background: #0f2924; padding: 3px 8px; border-radius: 4px; border: 1px solid #00ffcc44; }
    .progress-bar { width: 100%; height: 6px; background: #2e2e3a; border-radius: 3px; overflow: hidden; display: none; }
    .progress-bar.active { display: block; }
    .progress-bar div { height: 100%; background: #00ffcc; width: 0%; transition: width 0.2s; }
  </style>
</head>
<body>
  <aside>
    <h1>⚙ Pixelizador Retrô Pro</h1>

    <section>
      <h2>🎮 Paletas de Cores (<span id="paletaCount">0</span>)</h2>
      <select id="selectPaleta"></select>
      <div id="palettePreview" class="palette-preview"></div>
      <div class="row">
        <input type="color" id="customColor" value="#ff0055">
        <button id="btnAddCustom">+ Cor</button>
        <button id="btnUseCustom">Usar Custom</button>
        <button id="btnClearCustom">Limpar</button>
      </div>
    </section>

    <section>
      <h2>🧩 1. Modo de Pixelização (<span id="estiloCount">0</span>)</h2>
      <select id="selectEstilo"></select>
      <label>Bloco (px): <strong id="lblBloco">2</strong></label>
      <input type="range" id="rangeBloco" min="1" max="40" value="2">
      <div class="row">
        <label><input type="checkbox" id="chkGrade"> Grade</label>
        <label><input type="checkbox" id="chkContorno"> Contorno Preto</label>
      </div>
      <div class="row">
        <label style="flex:1">Brilho: <span id="lblBrilho">0</span></label>
        <input type="range" id="rangeBrilho" min="-100" max="100" value="0" style="flex:2">
      </div>
      <div class="row">
        <label style="flex:1">Contraste: <span id="lblContraste">0</span></label>
        <input type="range" id="rangeContraste" min="-100" max="100" value="0" style="flex:2">
      </div>
    </section>

    <section>
      <h2>🪄 Remover Fundo (Chroma Key)</h2>
      <div class="row">
        <label><input type="checkbox" id="chkChroma"> Ativar Remoção</label>
        <input type="color" id="chromaColor" value="#00ff00">
        <button id="btnCornerColor">✨ Cantos</button>
      </div>
      <label>Tolerância: <strong id="lblTol">35</strong></label>
      <input type="range" id="rangeTol" min="5" max="150" value="35">
    </section>

    <section>
      <h2>💾 Exportar Imagem / Vídeo</h2>
      <div class="row">
        <input type="text" id="fileName" value="pixel_art" placeholder="Nome do arquivo">
        <select id="exportFormat" style="width: 110px;">
          <option value="png">PNG (Transp.)</option>
          <option value="jpeg">JPG</option>
        </select>
      </div>
      <button class="primary" id="btnDownloadImg">💾 Baixar Imagem / Frame</button>
      <button id="btnRecordVideo">⏺ Gravar Vídeo (.WEBM)</button>
    </section>

    <section>
      <h2>📦 Exportar Sequência (.ZIP)</h2>
      <label>FPS da Sequência: <strong id="lblFps">12</strong></label>
      <input type="range" id="rangeFps" min="1" max="30" value="12">
      <label>Duração (s): <strong id="lblDur">3</strong></label>
      <input type="range" id="rangeDur" min="1" max="30" value="3">
      <div class="row">
        <button class="primary" id="btnExportZip" style="flex:1">📦 Exportar .ZIP (PNG)</button>
      </div>
      <div class="progress-bar" id="zipProgress"><div></div></div>
      <span id="zipStatus" style="font-size: 11px; color: #a1a1aa;"></span>
    </section>
  </aside>

  <main>
    <header>
      <div class="row">
        <input type="file" id="fileInput" accept="image/*,video/mp4,video/webm,video/ogg" style="display:none">
        <button class="primary" id="btnUpload">📂 Abrir Imagem ou Vídeo</button>
        <button id="btnTestImg">🖼 Imagem Teste</button>
        <button id="btnTestVid">🎬 Animação Teste</button>
        <button id="btnRenderNow">▶ Renderizar Agora</button>
      </div>
      <div class="row">
        <span id="statusBadge" class="status-badge">Pronto</span>
        <label>Zoom: <strong id="lblZoom">100%</strong></label>
        <input type="range" id="rangeZoom" min="25" max="300" value="100" style="width:90px">
      </div>
    </header>

    <div class="canvas-area">
      <canvas id="mainCanvas" width="480" height="320"></canvas>
    </div>

    <footer>
      <button id="btnPlayPause">⏸ Pausar</button>
      <button id="btnRestart">⏮ Início</button>
      <input type="range" id="videoSeek" min="0" max="100" value="0" step="0.1" style="flex:1">
      <span id="videoTime">0.0s / 0.0s</span>
      <label><input type="checkbox" id="chkLoop" checked> Loop</label>
      <label><input type="checkbox" id="chkMute" checked> Mudo</label>
    </footer>
  </main>

  <video id="hiddenVideo" playsinline muted loop crossOrigin="anonymous" style="display:none"></video>

  <!-- JSZip para exportar sequência PNG zipada -->
  <script src="jszip.min.js"></script>
  <script src="paletas.js"></script>
  <script src="estilos.js"></script>
  <script src="motor.js"></script>
</body>
</html>
